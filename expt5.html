<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration Form</title>

<link rel="stylesheet" href="expt5.css">

<script>

function validateForm(){

let name = document.getElementById("name").value;
let email = document.getElementById("email").value;
let phone = document.getElementById("phone").value;
let course = document.getElementById("course").value;
let password = document.getElementById("password").value;

let gender = document.getElementsByName("gender");
let genderSelected = false;

for(let i=0;i<gender.length;i++){
if(gender[i].checked){
genderSelected = true;
}
}

if(name==""){
alert("Name field cannot be empty");
return false;
}

else if(email==""){
alert("Email field cannot be empty");
return false;
}

else if(phone==""){
alert("Phone number cannot be empty");
return false;
}

else if(course==""){
alert("Please select a course");
return false;
}

else if(!genderSelected){
alert("Please select gender");
return false;
}

else if(password==""){
alert("Password field cannot be empty");
return false;
}

else{
alert("Form submitted successfully");
return true;
}

}

</script>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

<h2 class="logo">Student Portal</h2>

<ul class="nav-links">
<li>Home</li>
<li>Courses</li>
<li>Register</li>
<li>Contact</li>
</ul>

</nav>


<div class="container">


<div class="image-section">

<img src="https://static.vecteezy.com/system/resources/previews/008/864/279/non_2x/registration-desk-customer-service-desk-icon-ticket-counter-desk-simple-illustration-design-free-vector.jpg">

</div>


<div class="form-section">

<h2>Student Registration</h2>

<form onsubmit="return validateForm()">

<label>Full Name</label>
<input type="text" id="name">

<label>Email</label>
<input type="email" id="email">

<label>Phone Number</label>
<input type="text" id="phone">

<label>Course</label>
<select id="course">
<option value="">Select Course</option>
<option>B.Tech</option>
<option>BBA</option>
<option>BCA</option>
<option>MBA</option>
</select>

<label>Gender</label>
<div class="radio-group">
<input type="radio" name="gender" value="male"> Male
<input type="radio" name="gender" value="female"> Female
</div>

<label>Password</label>
<input type="password" id="password">

<button type="submit">Register</button>

</form>

</div>

</div>

</body>
</html>
